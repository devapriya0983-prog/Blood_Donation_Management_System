
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeSaver - Blood Request</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6fa;
            color: #333;
        }

        header {
            background: #c62828;
            color: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 650px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        h1 {
            color: #c62828;
            text-align: center;
            margin-bottom: 12px;
        }

        .description {
            color: #666;
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #c62828;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #a71919;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 18px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #c62828;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <header>
        <h2>❤️ LifeSaver</h2>
        <a href="dashboard.html">Dashboard</a>
    </header>

    <div class="container">

        <div class="form-card">

            <h1>Blood Request</h1>

            <p class="description">
                Fill in the details to submit a blood request.
            </p>

            <form id="requestForm">

                <div class="form-group">
                    <label for="patient_name">Patient Name</label>
                    <input
                        type="text"
                        id="patient_name"
                        name="patient_name"
                        required
                        maxlength="100"
                        placeholder="Enter patient name"
                    >
                </div>

                <div class="form-group">
                    <label for="blood_group">Required Blood Group</label>

                    <select id="blood_group" name="blood_group" required>
                        <option value="">Select Blood Group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="hospital">Hospital Name</label>
                    <input
                        type="text"
                        id="hospital"
                        name="hospital"
                        required
                        maxlength="150"
                        placeholder="Enter hospital name"
                    >
                </div>

                <div class="form-group">
                    <label for="city">City</label>
                    <input
                        type="text"
                        id="city"
                        name="city"
                        required
                        maxlength="100"
                        placeholder="Enter city"
                    >
                </div>

                <div class="form-group">
                    <label for="units">Required Units</label>
                    <input
                        type="number"
                        id="units"
                        name="units"
                        min="1"
                        max="20"
                        required
                        placeholder="Enter required units"
                    >
                </div>

                <div class="form-group">
                    <label for="contact">Contact Number</label>
                    <input
                        type="tel"
                        id="contact"
                        name="contact"
                        pattern="[0-9]{10}"
                        maxlength="10"
                        minlength="10"
                        required
                        placeholder="Enter 10-digit mobile number"
                    >
                </div>

                <div class="form-group">
                    <label for="required_date">Required Date</label>
                    <input
                        type="date"
                        id="required_date"
                        name="required_date"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="message_text">Additional Information</label>
                    <textarea
                        id="message_text"
                        name="message"
                        maxlength="500"
                        placeholder="Enter any additional information"
                    ></textarea>
                </div>

                <button type="submit" id="submitButton">
                    Submit Blood Request
                </button>

            </form>

            <p id="message"></p>

            <a href="dashboard.html" class="back">
                Back to Dashboard
            </a>

        </div>

    </div>

    <script>
        const requestForm = document.getElementById("requestForm");
        const message = document.getElementById("message");
        const submitButton = document.getElementById("submitButton");

        // Prevent selecting a past date
        const dateInput = document.getElementById("required_date");

        const today = new Date();
        const localToday = new Date(
            today.getTime() - today.getTimezoneOffset() * 60000
        ).toISOString().split("T")[0];

        dateInput.min = localToday;

        requestForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            submitButton.disabled = true;
            message.style.color = "#c62828";
            message.textContent = "Submitting request...";

            try {

                const formData = new FormData(requestForm);

                const response = await fetch("/api/blood-request", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: new URLSearchParams(formData)
                });

                const result = await response.text();

                if (response.ok) {

                    message.style.color = "green";
                    message.textContent = result;

                    requestForm.reset();
                    dateInput.min = localToday;

                } else {

                    message.style.color = "#c62828";
                    message.textContent = result;
                }

            } catch (error) {

                message.style.color = "#c62828";
                message.textContent =
                    "Server connection failed. Please try again.";

            } finally {

                submitButton.disabled = false;
            }
        });
    </script>

</body>
</html>
