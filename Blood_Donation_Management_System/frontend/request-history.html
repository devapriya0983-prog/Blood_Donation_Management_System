
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blood Request History - LifeSaver</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6fa;
            color: #333;
        }

        header {
            background: #c62828;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 35px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        h2 {
            color: #b71c1c;
        }

        button {
            background: #c62828;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #8e0000;
        }

        .request-card {
            background: white;
            padding: 22px;
            margin-bottom: 18px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #00000012;
            border-left: 5px solid #c62828;
        }

        .request-card h3 {
            margin-bottom: 14px;
            color: #b71c1c;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        .details p {
            font-size: 14px;
            line-height: 1.5;
        }

        .status {
            display: inline-block;
            margin-top: 15px;
            padding: 6px 12px;
            border-radius: 20px;
            background: #fff3cd;
            color: #856404;
            font-weight: bold;
            font-size: 13px;
        }

        .empty, .message {
            background: white;
            padding: 25px;
            text-align: center;
            border-radius: 10px;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .container {
                width: 94%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>LifeSaver</h1>
    <p>My Blood Request History</p>
</header>

<div class="container">

    <div class="top-bar">
        <h2>My Requests</h2>
        <button onclick="location.href='dashboard.html'">
            Back to Dashboard
        </button>
    </div>

    <div id="requestList">
        <div class="message">Loading your requests...</div>
    </div>

</div>

<script>
async function loadRequests() {

    const requestList = document.getElementById("requestList");

    try {

        const response = await fetch("/api/my-blood-requests", {
            method: "GET",
            credentials: "same-origin"
        });

        if (response.status === 401) {
            alert("Please login first!");
            location.href = "login.html";
            return;
        }

        if (!response.ok) {
            throw new Error("Unable to load request history");
        }

        const requests = await response.json();

        requestList.innerHTML = "";

        if (requests.length === 0) {
            requestList.innerHTML =
                '<div class="empty">You have not submitted any blood requests yet.</div>';
            return;
        }

        requests.forEach(request => {

            const card = document.createElement("div");
            card.className = "request-card";

            const title = document.createElement("h3");
            title.textContent = "Request #" + request.request_id;
            card.appendChild(title);

            const details = document.createElement("div");
            details.className = "details";

            const fields = [
                ["Patient Name", request.patient_name],
                ["Blood Group", request.blood_group],
                ["Units Required", request.units_required],
                ["Hospital", request.hospital_name],
                ["City", request.city],
                ["Request Date", request.request_date]
            ];

            fields.forEach(([label, value]) => {
                const p = document.createElement("p");
                const strong = document.createElement("strong");
                strong.textContent = label + ": ";
                p.appendChild(strong);
                p.appendChild(document.createTextNode(
                    value == null ? "" : String(value)
                ));
                details.appendChild(p);
            });

            card.appendChild(details);

            const status = document.createElement("span");
            status.className = "status";
            status.textContent = "Status: " + request.status;

            card.appendChild(status);
            requestList.appendChild(card);
        });

    } catch (error) {
        console.error(error);
        requestList.innerHTML =
            '<div class="message">Unable to load your requests. Please try again.</div>';
    }
}

loadRequests();
</script>

</body>
</html>
