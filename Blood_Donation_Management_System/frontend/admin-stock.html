```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeSaver - Blood Stock</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
        }

        header {
            background: #b71c1c;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            font-size: 25px;
        }

        .back-btn {
            background: white;

            padding: 10px 18px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;

        }

        h1 {
            color: #333;

        }

        .description {
            color: #666;

        }

        .stock-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .stock-table th,
        .stock-table td {
            padding: 16px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        .stock-table th {
            background: #b71c1c;

        }

        .stock-table tr:hover {
            background: #fff5f5;
        }

        .units {
            font-weight: bold;
            color: #b71c1c;
        }

            margin-top: 20px;
            color: #555;
            text-align: center;
        }

        @media(max-width: 600px) {
            .container {
                overflow-x: auto;
            }

            header {
                padding: 15px;
            }

            .stock-table {
                min-width: 500px;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>LifeSaver Admin</h2>
    <a href="admin-dashboard.html" class="back-btn">Back</a>
</header>

<div class="container">

    <h1>Blood Stock Management</h1>

    <p class="description">
        View the currently available blood units.
    </p>
<div class="stock-form">
    <h2>Update Blood Stock</h2>

    <label>Blood Group</label>
    <select id="bloodGroup">
        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
        <option value="O+">O+</option>
        <option value="O-">O-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
    </select>

    <label>Available Units</label>
    <input type="number" id="units" min="0" placeholder="Enter units">

    <button onclick="updateStock()">Update Stock</button>
    <p id="message"></p>
</div>

    <table class="stock-table">
        <thead>
            <tr>
                <th>Blood Group</th>
                <th>Available Units</th>
                <th>Stock Status</th>
            </tr>
        </thead>

        <tbody id="stockTable">
            <tr>
                <td colspan="3">Loading blood stock...</td>
            </tr>
        </tbody>
    </table>

    <p id="message"></p>

</div>

<script>
async function loadBloodStock() {

    const table = document.getElementById("stockTable");
    const message = document.getElementById("message");

    try {

        const response = await fetch("/api/admin/stock");

        if (response.status === 401 || response.status === 403) {
            message.textContent = "Admin access required. Please login again.";
            table.innerHTML = "";
            return;
        }

        if (!response.ok) {
            throw new Error("Unable to load blood stock");
        }

        const stock = await response.json();

        table.innerHTML = "";

        if (stock.length === 0) {
            table.innerHTML =
                '<tr><td colspan="3">No blood stock records found.</td></tr>';
            return;
        }

        stock.forEach(item => {

            const row = document.createElement("tr");

            const groupCell = document.createElement("td");
            groupCell.textContent = item.blood_group;

            const unitsCell = document.createElement("td");
            unitsCell.textContent = item.available_units;
            unitsCell.className = "units";

            const statusCell = document.createElement("td");
            statusCell.textContent =
                item.available_units > 0 ? "Available" : "Out of Stock";

            row.appendChild(groupCell);
            row.appendChild(unitsCell);
            row.appendChild(statusCell);

            table.appendChild(row);
        });

    } catch (error) {
        table.innerHTML = "";
        message.textContent = error.message;
    }
}

loadBloodStock();
async function updateStock() {

    const bloodGroup = document.getElementById("bloodGroup").value;
    const units = document.getElementById("units").value;
    const message = document.getElementById("message");

    if (units === "" || Number(units) < 0) {
        message.textContent = "Please enter valid units";
        return;
    }

    const data = new URLSearchParams();
    data.append("blood_group", bloodGroup);
    data.append("available_units", units);

    try {
        const response = await fetch("/api/admin/update-stock", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: data
        });

        const result = await response.text();

        message.textContent = result;

        if (response.ok) {
            document.getElementById("units").value = "";
            loadBloodStock();
        }

    } catch (error) {
        message.textContent = "Unable to update blood stock";
        console.error(error);
    }
}
</script>

</body>
</html>
