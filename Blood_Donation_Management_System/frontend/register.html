
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Registration - LifeSaver</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h2>❤️ LifeSaver</h2>
        <nav>
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Donor Registration</h1>
        <p>Register yourself and become a lifesaver!</p>

        <form class="register-form" id="registerForm">

            <input type="text" name="name"
                   placeholder="Full Name" required>

            <input type="email" name="email"
                   placeholder="Email Address" required>

            <input type="tel" name="phone"
                   placeholder="Mobile Number" required>

            <input type="number" name="age"
                   placeholder="Age" min="18" max="100" required>

            <select name="blood_group" required>
                <option value="">Select Blood Group</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
            </select>

            <select name="gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>

            <input type="text" name="city"
                   placeholder="City" required>

            <textarea name="address"
                      placeholder="Address" required></textarea>

            <input type="password" name="password"
                   placeholder="Create Password"
                   required minlength="8">

            <button type="submit" id="registerButton">
                Register Now
            </button>

            <p id="message" role="status"
               aria-live="polite"></p>

        </form>
    </section>

    <script>
        const form = document.getElementById("registerForm");
        const message = document.getElementById("message");
        const button = document.getElementById("registerButton");

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            console.log("REGISTER BUTTON WORKING!");

            message.textContent = "Registering... Please wait.";
            message.style.color = "blue";
            button.disabled = true;

            try {
                const formData = new FormData(form);

                console.log("Sending registration request...");

                const response = await fetch("/api/register", {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },
                    body: new URLSearchParams(formData).toString()
                });

                console.log("Server response:", response.status);

                const result = await response.text();

                console.log("Registration result:", result);

                if (response.ok &&
                    result.includes("Donor Registered Successfully")) {

                    message.textContent = "❤️ " + result;
                    message.style.color = "green";

                    alert("❤️ Donor Registered Successfully!");

                    form.reset();

                } else {

                    message.textContent =
                        "Registration Failed: " + result;

                    message.style.color = "red";
                }

            } catch (error) {

                console.error("Registration Error:", error);

                message.textContent =
                    "Unable to connect to server: " + error.message;

                message.style.color = "red";

            } finally {

                button.disabled = false;
            }
        });
    </script>

</body>
</html>
