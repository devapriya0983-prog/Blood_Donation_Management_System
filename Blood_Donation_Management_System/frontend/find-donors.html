
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeSaver - Find Blood Donors</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6fa;
            color: #333;
        }

        header {
            background: #c62828;
            color: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .search-card, .results-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        h1 {
            color: #c62828;
            text-align: center;
            margin-bottom: 15px;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            background: #c62828;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #a71919;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            color: #c62828;
        }

        .donor {
            background: #fff5f5;
            padding: 18px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 4px solid #c62828;
        }

        .donor h3 {
            color: #c62828;
            margin-bottom: 10px;
        }

        .donor p {
            margin: 6px 0;
        }

        .back {
            display: block;
            text-align: center;
            margin: 20px;
            color: #c62828;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <header>
        <h2>❤️ LifeSaver</h2>
        <a href="dashboard.html">Dashboard</a>
    </header>

    <div class="container">

        <div class="search-card">

            <h1>Find Blood Donors</h1>

            <p class="description">
                Search for available blood donors by blood group and city.
            </p>

            <form id="searchForm">

                <div class="form-group">
                    <label for="blood_group">Select Blood Group</label>

                    <select id="blood_group" name="blood_group">
                        <option value="">All Blood Groups</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="city">Enter City</label>
                    <input
                        type="text"
                        id="city"
                        name="city"
                        placeholder="Enter city name"
                    >
                </div>

                <button type="submit" id="searchButton">
                    Search Donors
                </button>

            </form>

            <p id="message"></p>

        </div>

        <div class="results-card">
            <h2>Available Donors</h2>
            <div id="results">
                <p>Search to view available donors.</p>
            </div>
        </div>

        <a href="dashboard.html" class="back">
            Back to Dashboard
        </a>

    </div>

    <script>
        const searchForm = document.getElementById("searchForm");
        const message = document.getElementById("message");
        const results = document.getElementById("results");
        const searchButton = document.getElementById("searchButton");

        searchForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            const bloodGroup =
                document.getElementById("blood_group").value;

            const city =
                document.getElementById("city").value.trim();

            const params = new URLSearchParams({
                blood_group: bloodGroup,
                city: city
            });

            searchButton.disabled = true;
            message.textContent = "Searching donors...";
            results.innerHTML = "";

            try {

                const response = await fetch(
                    "/api/donors?" + params.toString(),
                    { credentials: "same-origin" }
                );

                const data = await response.json();

                if (response.status === 401) {
                    message.textContent = "Please login again.";
                    return;
                }

                if (!response.ok) {
                    message.textContent =
                        data.message || "Unable to search donors.";
                    return;
                }

                message.textContent = "";

                if (data.length === 0) {
                    results.textContent = "No available donors found.";
                    return;
                }

                data.forEach(function(donor) {

                    const card = document.createElement("div");
                    card.className = "donor";

                    const name = document.createElement("h3");
                    name.textContent = donor.name;

                    const blood = document.createElement("p");
                    blood.textContent =
                        "Blood Group: " + donor.blood_group;

                    const cityText = document.createElement("p");
                    cityText.textContent = "City: " + donor.city;

                    card.append(name, blood, cityText);
                    results.appendChild(card);
                });

            } catch (error) {

                message.textContent =
                    "Server connection failed. Please try again.";

            } finally {

                searchButton.disabled = false;
            }
        });
    </script>

</body>
</html>
